<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#121210" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HardFit" />
    <title>HardFit</title>
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('replog_theme_vars');
          if (!raw) return;
          var data = JSON.parse(raw);
          if (!data || !data.vars) return;
          var root = document.documentElement;
          var s = root.style;
          for (var k in data.vars) {
            s.setProperty('--' + k, data.vars[k]);
          }
          if (data.mode) {
            s.colorScheme = data.mode;
            if (data.mode === 'dark') {
              root.classList.add('dark');
            } else {
              root.classList.remove('dark');
            }
          }
          var themeId = data.themeId || data.theme || data.id;
          if (themeId) {
            root.setAttribute('data-theme', themeId);
          }
          if (data.bgHex) {
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', data.bgHex);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-black text-white min-h-screen selection:bg-accent selection:text-accent-fg">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
